# --- System File Paths ---

paths:

  base_dir: "D:\\Parth\\vanco-solution-architecture\\grocery_forecasting\\data\\raw"

  train: "train.csv"

  test: "test.csv"

  oil: "oil.csv"

  stores: "stores.csv"

  holidays: "holidays_events.csv"

  transactions: "transactions.csv"

  output_submission: "D:\\Parth\\vanco-solution-architecture\\grocery_forecasting\\submission.csv"



# --- Validation and Splitting Coordinates ---

validation:

  val_cutoff: "2017-08-01"

  early_stopping_rounds: 50



# --- Experiment Execution Matrix ---

model_experiments:

  - model_type: "lightgbm"

    experiment_name: "lgb_baseline"

    num_boost_rounds: 1000

    params:

      objective: "regression"

      metric: "rmse"

      learning_rate: 0.05

      num_leaves: 31

      max_depth: 6

      seed: 42

      verbose: -1

      n_jobs: -1



  - model_type: "xgboost"

    experiment_name: "xgb_baseline"

    num_boost_rounds: 800

    params:

      objective: "reg:squarederror"

      eval_metric: "rmse"

      learning_rate: 0.05

      max_depth: 5

      subsample: 0.8

      colsample_bytree: 0.8

      seed: 42

      tree_method: "hist"

      n_jobs: -1

